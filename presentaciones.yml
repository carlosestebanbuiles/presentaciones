# Metadatos opcionales de las presentaciones.
# La clave es el nombre del archivo en fuentes/ sin la extensión.
# Si una presentación no aparece aquí, se publica igual con el nombre del archivo como título.

_sitio:
  titulo: Presentaciones
  subtitulo: Clases y charlas de Endocrinología. Se pueden presentar desde el navegador o descargar en PDF.
  pie: "Contacto: cbuiles@hptu.org.co"
  # Orden de las categorías en el índice (las no listadas van después, alfabéticamente)
  orden_categorias:
    - Académicas
    - HPTU
    - Industria farmacéutica
    - Festina Lente
  sin_clasificar: Sin clasificar
  # Portada de cada carpeta: color e ícono (academico, industria, carpeta) o una imagen de la carpeta portadas/.
  # Las subcarpetas sin configuración heredan el color de su carpeta madre con un matiz propio.
  # Para una subcarpeta se usa la ruta completa, por ejemplo "Industria farmacéutica / Amgen".
  portadas:
    Académicas: {color: "#2e7d5b", icono: academico}
    Industria farmacéutica: {color: "#1f5fae", icono: industria}
    Festina Lente: {imagen: festina-lente.jpg, color: "#33434a"}
    HPTU: {imagen: hptu.jpg, color: "#1069a2"}

