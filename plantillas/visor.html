<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentación</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #escenario { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; cursor: none; }
  #escenario.activo { cursor: default; }
  .diapo { position: absolute; max-width: 100%; max-height: 100%; width: auto; height: auto; aspect-ratio: 16 / 9; object-fit: contain;
           opacity: 0; transition: opacity .45s ease; user-select: none; -webkit-user-drag: none; }
  .diapo.visible { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .diapo { transition: none; } }

  #barra { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; display: flex; gap: 12px; align-items: center;
           background: linear-gradient(transparent, rgba(0,0,0,.75)); opacity: 0; transition: opacity .3s; }
  #barra.visible, #barra:hover { opacity: 1; }
  #barra button, #barra a { background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px;
                            font-size: 14px; cursor: pointer; text-decoration: none; }
  #barra button:hover, #barra a:hover { background: rgba(255,255,255,.25); }
  #contador { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .85; }
  #progreso { position: fixed; left: 0; bottom: 0; height: 3px; background: #4da3ff; width: 0; transition: width .3s; }
  #ayuda { position: fixed; top: 14px; right: 16px; font-size: 13px; opacity: .6; transition: opacity 1s; pointer-events: none; }
  #ayuda.oculta { opacity: 0; }

  /* Menú lateral de diapositivas (M para abrir/cerrar) */
  #menu { position: fixed; top: 0; left: 0; bottom: 0; width: 250px; z-index: 10; overflow-y: auto; overscroll-behavior: contain;
          background: rgba(14, 16, 20, .94); backdrop-filter: blur(6px); box-shadow: 4px 0 24px rgba(0,0,0,.45);
          transform: translateX(-105%); transition: transform .25s ease; padding: 12px 12px 24px; box-sizing: border-box; }
  #menu.abierto { transform: none; }
  #menu .cab { display: flex; align-items: center; justify-content: space-between; margin: 2px 2px 12px; font-size: 13px; opacity: .8; }
  #menu .cab button { background: none; border: 0; color: #fff; font-size: 20px; line-height: 1; cursor: pointer; opacity: .8; padding: 2px 6px; }
  #menu .cab button:hover { opacity: 1; }
  #menu h4 { margin: 16px 2px 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
             color: #8fc3ff; cursor: pointer; }
  #menu h4:first-of-type { margin-top: 4px; }
  #menu h4:hover { color: #fff; }
  #menu .mini { display: flex; gap: 8px; align-items: flex-start; padding: 5px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; }
  #menu .mini:hover { background: rgba(255,255,255,.08); }
  #menu .mini.actual { background: rgba(77,163,255,.22); }
  #menu .mini span { width: 22px; flex: none; text-align: right; font-size: 12px; opacity: .6; padding-top: 2px; font-variant-numeric: tabular-nums; }
  #menu .mini img { width: 100%; min-width: 0; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; background: #222;
                    outline: 2px solid transparent; }
  #menu .mini.actual img { outline-color: #4da3ff; }
  #menu .mini.actual span { opacity: 1; color: #8fc3ff; }
</style>
</head>
<body>
<div id="escenario" class="activo"></div>
<nav id="menu" aria-label="Diapositivas">
  <div class="cab"><span>Diapositivas</span><button id="cerrarMenu" title="Cerrar (M)">×</button></div>
  <div id="listaMenu"></div>
</nav>
<div id="barra">
  <button id="botonMenu" title="Menú de diapositivas (M)">☰ Diapositivas</button>
  <button id="ant" title="Anterior (←)">◀</button>
  <button id="sig" title="Siguiente (→ o espacio)">▶</button>
  <button id="pantalla" title="Pantalla completa (F)">⛶ Pantalla completa</button>
  <a href="./" title="Volver a la ficha">↩ Ficha</a>
  <a href="../" title="Todas las presentaciones">⌂ Índice</a>
  <span id="contador"></span>
</div>
<div id="progreso"></div>
<div id="ayuda">← → para avanzar · M menú · F pantalla completa · B pantalla en negro</div>

<script>
(async () => {
  const escenario = document.getElementById('escenario');
  const contador = document.getElementById('contador');
  const progreso = document.getElementById('progreso');
  const ayuda = document.getElementById('ayuda');

  const info = await fetch('visor.json').then(r => r.json()).catch(() => ({ n: 0 }));
  const total = info.n || 0;
  document.title = info.titulo || 'Presentación';
  const version = info.v ? `?v=${info.v}` : '';
  const ruta = i => `diapositivas/${String(i).padStart(3, '0')}.jpg${version}`;

  let actual = Math.min(Math.max(parseInt(location.hash.slice(1)) || 1, 1), Math.max(total, 1));
  let imgVisible = null;

  // ---- Menú lateral ----
  const menu = document.getElementById('menu');
  const lista = document.getElementById('listaMenu');
  const mini = i => `diapositivas/m/${String(i).padStart(3, '0')}.jpg${version}`;
  const secciones = (info.secciones || []).filter(s => s.desde >= 1 && s.desde <= total);
  const inicioSeccion = new Map(secciones.map(s => [s.desde, s.titulo]));
  const items = [];
  for (let i = 1; i <= total; i++) {
    if (inicioSeccion.has(i)) {
      const h = document.createElement('h4');
      h.textContent = inicioSeccion.get(i);
      h.onclick = () => irDesdeMenu(i);
      lista.appendChild(h);
    }
    const fila = document.createElement('div');
    fila.className = 'mini';
    fila.innerHTML = `<span>${i}</span><img loading="lazy" alt="Diapositiva ${i}">`;
    fila.querySelector('img').src = mini(i);
    // Si no hay miniatura (sitio viejo en caché), usar la imagen grande
    fila.querySelector('img').onerror = function () { this.onerror = null; this.src = ruta(i); };
    fila.onclick = () => irDesdeMenu(i);
    lista.appendChild(fila);
    items.push(fila);
  }
  function marcarEnMenu(i, desplazar = true) {
    items.forEach((el, k) => el.classList.toggle('actual', k + 1 === i));
    if (desplazar && menu.classList.contains('abierto') && items[i - 1])
      items[i - 1].scrollIntoView({ block: 'nearest' });
  }
  function abrirMenu(abrir) {
    menu.classList.toggle('abierto', abrir);
    if (abrir && items[actual - 1]) items[actual - 1].scrollIntoView({ block: 'center' });
  }
  const alternarMenu = () => abrirMenu(!menu.classList.contains('abierto'));
  function irDesdeMenu(i) {
    mostrar(i);
    if (innerWidth < 700) abrirMenu(false);  // en celular el menú tapa la diapositiva
  }
  document.getElementById('botonMenu').onclick = alternarMenu;
  document.getElementById('cerrarMenu').onclick = () => abrirMenu(false);

  function precargar(i) { if (i >= 1 && i <= total) { const im = new Image(); im.src = ruta(i); } }

  function mostrar(i, inmediato = false) {
    if (i < 1 || i > total) return;
    actual = i;
    const nueva = document.createElement('img');
    nueva.className = 'diapo';
    nueva.src = ruta(i);
    nueva.alt = `Diapositiva ${i}`;
    escenario.appendChild(nueva);
    const anterior = imgVisible;
    imgVisible = nueva;
    const activar = () => {
      requestAnimationFrame(() => nueva.classList.add('visible'));
      if (anterior) {
        anterior.classList.remove('visible');
        setTimeout(() => anterior.remove(), inmediato ? 0 : 500);
      }
    };
    nueva.complete ? activar() : nueva.addEventListener('load', activar, { once: true });
    contador.textContent = `${i} / ${total}`;
    marcarEnMenu(i);
    progreso.style.width = (100 * i / total) + '%';
    history.replaceState(null, '', '#' + i);
    precargar(i + 1); precargar(i + 2); precargar(i - 1);
  }

  const siguiente = () => mostrar(actual + 1);
  const anteriorD = () => mostrar(actual - 1);
  const pantallaCompleta = () => document.fullscreenElement
      ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});

  document.getElementById('sig').onclick = siguiente;
  document.getElementById('ant').onclick = anteriorD;
  document.getElementById('pantalla').onclick = pantallaCompleta;

  // Pantalla en negro (botón "blank" de los presentadores de mano: envía "." o "b")
  const negro = document.createElement('div');
  negro.style.cssText = 'position:fixed;inset:0;background:#000;display:none;z-index:20';
  document.body.appendChild(negro);
  const alternarNegro = () => { negro.style.display = negro.style.display === 'none' ? 'block' : 'none'; };

  document.addEventListener('keydown', e => {
    if (['ArrowRight', ' ', 'PageDown', 'Enter', 'n', 'N', 'ArrowDown'].includes(e.key)) { e.preventDefault(); siguiente(); }
    else if (['ArrowLeft', 'PageUp', 'Backspace', 'p', 'P', 'ArrowUp'].includes(e.key)) { e.preventDefault(); anteriorD(); }
    else if (e.key === 'Home') mostrar(1);
    else if (e.key === 'End') mostrar(total);
    else if (e.key === 'f' || e.key === 'F') pantallaCompleta();
    // Botón "iniciar presentación" de los presentadores: envía F5 (o Mayús+F5). En vez de recargar, pantalla completa.
    else if (e.key === 'F5') { e.preventDefault(); pantallaCompleta(); }
    else if (['.', 'b', 'B'].includes(e.key)) { e.preventDefault(); alternarNegro(); }
    else if (e.key === 'm' || e.key === 'M') { e.preventDefault(); alternarMenu(); }
    else if (e.key === 'Escape' && menu.classList.contains('abierto')) abrirMenu(false);
  });

  // Clic: mitad derecha avanza, mitad izquierda retrocede
  escenario.addEventListener('click', e => (e.clientX > innerWidth / 2 ? siguiente() : anteriorD()));

  // Deslizar en pantallas táctiles
  let x0 = null;
  escenario.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  escenario.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) (dx < 0 ? siguiente() : anteriorD());
  });

  // Ocultar cursor y barra tras unos segundos sin mover el ratón
  let temporizador;
  const despertar = () => {
    escenario.classList.add('activo');
    clearTimeout(temporizador);
    temporizador = setTimeout(() => escenario.classList.remove('activo'), 2500);
  };
  // La barra solo aparece con el ratón en el borde inferior (el Spotlight mueve el cursor al señalar)
  const barra = document.getElementById('barra');
  document.addEventListener('mousemove', e => {
    despertar();
    barra.classList.toggle('visible', e.clientY > innerHeight - 70);
  });
  despertar();
  setTimeout(() => ayuda.classList.add('oculta'), 5000);

  if (total) mostrar(actual, true);
  else escenario.textContent = 'No hay diapositivas.';
})();
</script>
</body>
</html>
